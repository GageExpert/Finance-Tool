version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: axium
      POSTGRES_PASSWORD: axium
      POSTGRES_DB: axium
    ports: ["5432:5432"]
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports: ["6379:6379"]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    depends_on: [postgres, redis]
    ports: ["8000:8000"]

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.workers.celery_app.celery worker -l info
    env_file: .env
    depends_on: [backend, redis]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on: [backend]
    ports: ["3000:3000"]

volumes:
  pg_data:
